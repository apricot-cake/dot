name: Set up app tests
description: >-
  app-tests のシャードがテストを走らせる前に必要なもの一式＝依存の木・アプリの
  バンドル・Playwright の Chromium。あのジョブを並列のシャードへ割ったとき（#937）
  app-tests.yml から切り出した。下の手順はどのシャードでも同一なので、3回書く
  代わりにここへ1回だけ置いてある。

  各シャードはこの準備をアーティファクトで受け取らず、毎回やり直す。依存の木も
  キャッシュしない。PR 内の先行 run が書き換えた実行ファイルを、同じ lockfile の
  後続 run が復元するとテスト結果を偽装できるためである。

runs:
  using: composite
  steps:
    # node_modules は保存せず、pnpm のストアだけを再利用する。
    - name: Setup pnpm and Node
      uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
      with:
        runtime: node@24.16.0
        cache: true
        install: false
    - name: Install dependencies
      shell: pwsh
      run: pnpm install --frozen-lockfile
    - name: Prepare development environment
      shell: pwsh
      run: pnpm run setup
    # decoder は固定ソースから各ランナーで作り直す。MSVC/CMake/Ninja は
    # windows-latest の既存ツール、Meson と NASM は隔離ディレクトリに用意する。
    - name: Prepare AVIF build tools
      shell: pwsh
      run: |
        $tools = Join-Path $env:GITHUB_WORKSPACE '.sandbox/avif-build-tools'
        New-Item -ItemType Directory -Force -Path $tools | Out-Null
        python -m pip install --disable-pip-version-check --no-input --target $tools meson==1.10.0
        if ($LASTEXITCODE -ne 0) { throw 'Meson の準備に失敗しました。' }
        $archive = Join-Path $tools 'nasm-3.01-win64.zip'
        Invoke-WebRequest -Uri 'https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip' -OutFile $archive
        $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($digest -ne 'e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4') { throw 'NASM の SHA256 が一致しません。' }
        Expand-Archive -LiteralPath $archive -DestinationPath $tools
        (Join-Path $tools 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        (Join-Path $tools 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        (Join-Path $tools 'nasm-3.01') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        "PYTHONPATH=$tools" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    # 拡張機能のブラウザテストは、通常の Chrome 向け出力ではなくテスト用の
    # chrome-mv3-test を読み込む。これは install の副作用ではないので、各
    # シャードの共通準備で明示的に作る。
    - name: Build test extension
      shell: pwsh
      run: pnpm run ext:build:test
    # ハーネスは app/ で `electron .` を起こす。その main フィールドは app/out を
    # 指している。取り出したばかりのチェックアウトにはビルド出力が無く、
    # `pnpm run setup` も作らないので、これが無いとどのハーネスも入口が無くて死ぬ。
    - name: Build app bundles
      shell: pwsh
      run: pnpm --dir app run _build
    # Playwright のブラウザのビルドは、package.json の `^` 範囲ではなく解決後の
    # @playwright/test のバージョンに結び付いている。導入済みパッケージから読み、
    # キャッシュのキーが実際に入るものを追いかける。
    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      run: |
        version=$(node -p "require('@playwright/test/package.json').version")
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~\AppData\Local\ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
    # Chromium は各ジョブで明示的に準備する。キャッシュがあれば再利用する。
    # 展開済みの MV3 拡張機能を読み込むテストは Chromium で実行する。
    - name: Install Playwright Chromium
      shell: pwsh
      run: pnpm exec playwright install chromium
