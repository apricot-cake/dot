name: 機能要望
description: 追加してほしい機能や改善の提案はこちら
body:
  - type: markdown
    attributes:
      value: |
        投稿は公開されます。個人情報やログイン情報は載せないでください。
        画像を添付する場合は、内容を確認してから添付してください。
  - type: textarea
    id: request
    attributes:
      label: 希望する機能・動作
      description: 追加してほしい機能や、改善後に期待する動作を記入してください。
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 利用場面・困っていること
      description: どのような場面で使いますか？ 現在の問題や、この機能が必要な理由を教えてください。
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 補足・具体例
      description: 具体例や画像、現在の代替手段など、参考になる情報があれば追加してください。
