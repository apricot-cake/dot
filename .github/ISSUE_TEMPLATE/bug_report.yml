name: 不具合報告
description: dot が期待どおりに動かない場合はこちら
body:
  - type: markdown
    attributes:
      value: |
        投稿は公開されます。個人情報やログイン情報は載せないでください。
        画像やログを添付する場合は、内容を確認してから添付してください。
  - type: textarea
    id: summary
    attributes:
      label: 問題の概要
      description: どの機能で、どのような問題が起きていますか？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 問題が起きるまでの操作を、分かる範囲で教えてください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
      description: 本来はどう動いてほしかったですか？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際に起きた結果を記入してください。エラーメッセージがあれば、その内容も記入してください。
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: アプリのバージョン
      description: 「ヘルプ」→「dotについて」で確認できます。
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS・バージョン
      description: 使用している OS とバージョンを記入してください。
      placeholder: Windows 11 25H2
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: 拡張機能のバージョン
      description: |
        拡張機能に関する問題の場合に記入してください。
        Chrome のアドレスバーに `chrome://extensions` を入力し、dot の「詳細」を開くと「バージョン」を確認できます。
  - type: input
    id: browser-version
    attributes:
      label: ブラウザ・バージョン
      description: 拡張機能に関する問題の場合、使用しているブラウザ名とバージョンを記入してください。
  - type: textarea
    id: additional
    attributes:
      label: 補足・画像・ログ
      description: 発生頻度、画像、ログなど、参考になる情報があれば追加してください。
