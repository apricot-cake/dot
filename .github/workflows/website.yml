name: 公式サイト

on:
  push:
    branches: [main]
    paths: &website-paths
      - 'docs/site/**'
      - 'docs/PRIVACY.md'
      - 'app/src/renderer/design-tokens.css'
      - 'app/src/renderer/src/_shared/PostCard.tsx'
      - 'app/src/renderer/src/components/ui/button.tsx'
      - 'app/src/renderer/src/lib/utils.ts'
      - 'app/src/renderer/src/services/format.ts'
      - 'extension/utils/overlay/constants.ts'
      - 'extension/utils/tokens.source.css'
      - '.github/workflows/website.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.npmrc'
      - 'extension/package.json'
  pull_request:
    paths: *website-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ページと操作デモの検証
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24.16.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm run site:check
      - run: pnpm run site:build
      - run: pnpm --dir docs/site exec playwright install --with-deps chromium
      - run: pnpm run site:test
      - name: 公開用ファイルを保存
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/dist

  deploy:
    name: GitHub Pages に公開
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
