version = 1
name = "ローカル"

[setup]
script = "pnpm install --frozen-lockfile && pnpm run setup"

[[actions]]
name = "検証"
icon = "test"
command = "pnpm run check"

[[actions]]
name = "アプリを起動"
icon = "run"
command = "pnpm run app:dev"

[[actions]]
name = "拡張機能を開発"
icon = "debug"
command = "pnpm run ext:dev:open"

[[actions]]
name = "拡張機能をビルド"
icon = "tool"
command = "pnpm run ext:build"

[[actions]]
name = "拡張機能を型検査"
icon = "test"
command = "pnpm --dir extension run typecheck"
