packages:
  - app
  - extension
  - docs/site

# Electron Forge requires a flat node_modules tree for packaging.
# https://www.electronforge.io/
nodeLinker: hoisted
# Keep each workspace dependency tree within its own project boundary.
hoistingLimits: workspaces

overrides:
  adm-zip: 0.6.0
  js-yaml: ^4.3.2
  markdownlint-cli2>smol-toml: 1.9.0
  micromark-extension-math>katex: 0.18.2
  sharp: 0.35.5

# electron-vite 5 declares Vite 5–7; the existing build uses Vite 8.
peerDependencyRules:
  allowedVersions:
    electron-vite@5>vite: ^8.0.0

allowBuilds:
  '@tailwindcss/oxide': true
  better-sqlite3: false
  classic-level: true
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  sharp: true
